<script>(function () {
  var C = JSON.parse(document.getElementById('cfg').textContent);
  var S = JSON.parse(document.getElementById('strings').textContent);
  var MAX_SEED = 281474976710655, MAX_SCORE = 999999999, MAX_LINK = 2048;
  var MAX_SEED_CHARS = 10, MAX_SCORE_DIGITS = 10, MAX_VERSION_DIGITS = 4;
  var ALPHABET = '0123456789abcdefghjkmnpqrstvwxyz', RADIX = 32;
  var MODE = /^[a-z0-9_-]{1,24}$/, DIGITS = /^[0-9]+$/;
  var PACKAGE = /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/, MAX_PACKAGE = 100;
  var KINDS = ['challenge', 'result', 'invite'];

  function decodeSeed(text) {
    if (!text || text.length > MAX_SEED_CHARS) return null;
    var value = 0, t = text.toLowerCase();
    for (var i = 0; i < t.length; i++) {
      var c = t.charAt(i);
      if (c === 'i' || c === 'l') c = '1'; else if (c === 'o') c = '0';
      var d = ALPHABET.indexOf(c);
      if (d < 0) return null;
      value = value * RADIX + d;  // < 2^50: exact in a double
    }
    return value > MAX_SEED ? null : value;
  }

  function encodeSeed(seed) {
    if (seed === 0) return ALPHABET.charAt(0);
    var out = '';
    for (var rest = seed; rest > 0; rest = Math.floor(rest / RADIX)) out = ALPHABET.charAt(rest % RADIX) + out;
    return out;
  }

  function scoreOf(text) {
    if (text == null || !DIGITS.test(text)) return null;
    if (text.length > MAX_SCORE_DIGITS) return MAX_SCORE;
    return Math.min(parseInt(text, 10), MAX_SCORE);
  }

  // Same rules as ChallengeLink._fromFields. A link that would be rejected
  // in the app becomes a plain invite here: the page still helps.
  function parse(search) {
    var invite = { kind: 'invite', seed: null, mode: null, version: null, score: null, campaign: null };
    if (search.length > MAX_LINK) return invite;
    var params, q = {};
    try { params = new URLSearchParams(search); } catch (e) { return invite; }
    var repeated = false;
    params.forEach(function (v, k) { if (Object.prototype.hasOwnProperty.call(q, k)) repeated = true; q[k] = v; });
    if (repeated) return invite;
    function field(k) { return Object.prototype.hasOwnProperty.call(q, k) ? q[k] : null; }

    var seedText = field('s'), seed = seedText == null ? null : decodeSeed(seedText);
    if (seedText != null && seed == null) return invite;
    var medium = KINDS.indexOf(field('utm_medium')) >= 0 ? field('utm_medium') : null;
    var kind = medium == null ? (seed == null ? 'invite' : 'challenge')
      : (medium === 'invite' && seed != null) ? 'challenge'
      : (medium !== 'invite' && seed == null) ? 'invite' : medium;
    var version = null;
    if (seed != null) {
      var vt = field('v');
      if (vt == null || vt.length > MAX_VERSION_DIGITS || !DIGITS.test(vt)) return invite;
      version = parseInt(vt, 10);
      if (version < 1) return invite;
    }
    var mode = field('m');
    if (mode != null) { mode = mode.toLowerCase(); if (!MODE.test(mode)) return invite; }
    var campaign = field('utm_campaign');
    if (campaign != null && (campaign.length > MAX_PACKAGE || !PACKAGE.test(campaign))) campaign = null;
    return { kind: kind, seed: seed, mode: mode, version: version, score: scoreOf(field('sc')), campaign: campaign };
  }

  function query(pairs) {
    return pairs.filter(function (p) { return p[1] != null; })
      .map(function (p) { return encodeURIComponent(p[0]) + '=' + encodeURIComponent(String(p[1])); }).join('&');
  }

  function payload(c) {
    var seed = c.seed == null ? null : encodeSeed(c.seed);
    return [['s', seed], ['m', c.mode], ['v', c.seed == null ? null : c.version], ['sc', c.score]];
  }

  // ChallengeLink.referrer + playStoreUri: the order of the fields matters
  // only for byte equality with the app, not for Play.
  function playUrl(c) {
    var referrer = query([['utm_source', 'pikko_share'], ['utm_medium', c.kind], ['utm_campaign', C.pkg],
      ['utm_content', C.game]].concat(payload(c)));
    return 'https://play.google.com/store/apps/details?' + query([['id', C.pkg], ['referrer', referrer]]);
  }

  // The link itself rebuilt from validated fields only, as ChallengeLink.uri.
  function appLinkQuery(c) {
    return query(payload(c).concat([['utm_source', 'pikko_share'], ['utm_medium', c.kind],
      ['utm_campaign', c.campaign || C.pkg]]));
  }

  // Chrome intent: opens the app when it handles the link, else goes to
  // browser_fallback_url (the Play listing with the referrer).
  function intentUrl(c) {
    var q = appLinkQuery(c);
    return 'intent://' + C.host + C.path + (q ? '?' + q : '') + '#Intent;scheme=https;package=' + C.pkg +
      ';S.browser_fallback_url=' + encodeURIComponent(playUrl(c)) + ';end';
  }

  window.PikkoChallenge = { parse: parse, playUrl: playUrl, intentUrl: intentUrl, encodeSeed: encodeSeed, decodeSeed: decodeSeed };
  if (!document.getElementById('title')) return;

  var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  var lang = 'en';
  for (var i = 0; i < langs.length; i++) {
    var sub = String(langs[i] || '').toLowerCase().split('-')[0];
    if (Object.prototype.hasOwnProperty.call(S, sub)) { lang = sub; break; }
  }
  var T = S[lang];
  document.documentElement.lang = lang;
  var name = C.name[lang] || C.name.en;
  function set(id, text) { document.getElementById(id).textContent = text; }

  var c = parse(location.search.replace(/^\?/, ''));
  set('game', name);
  set('title', c.kind === 'invite' ? T.invite.replace('{game}', name) : T[c.kind]);
  var scoreEl = document.getElementById('score'), sameEl = document.getElementById('same');
  if (c.score != null) {
    var shown = String(c.score);
    try { shown = new Intl.NumberFormat(lang).format(c.score); } catch (e) { /* keep plain digits */ }
    scoreEl.textContent = T.beat.replace('{score}', shown);
    scoreEl.hidden = false;
  }
  if (c.seed != null) { sameEl.textContent = T.same; sameEl.hidden = false; }

  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var open = document.getElementById('open'), play = document.getElementById('play');
  set('open', T.open); set('play', T.play); set('more', T.more);
  play.href = playUrl(c);
  if (android) {
    open.href = intentUrl(c); open.hidden = false;
    set('note', T.hint);
  } else if (ios && C.appStore) {
    open.href = 'https://apps.apple.com/app/id' + C.appStore; open.hidden = false;
  } else {
    set('note', ios ? T.ios : T.desktop);
  }
})();</script>
