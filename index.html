<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pikko Games</title>
<style>
  :root { color-scheme: light dark; }
  body {
    max-width: 40rem; margin: 0 auto; padding: 4rem 1.25rem;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .logo {
    width: 88px; height: 88px; margin: 0 auto 1.5rem; border-radius: 24px;
    background: linear-gradient(135deg, #6C5CE7, #00B8D4);
    display: grid; place-items: center;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 14px); gap: 5px; }
  .grid i { width: 14px; height: 14px; background: #fff; border-radius: 3px; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: #666; }
  a { color: #6C5CE7; }
  @media (prefers-color-scheme: dark) { p { color: #aaa; } a { color: #8f7ff5; } }
</style>
</head>
<body>
  <div class="logo">
    <div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <h1>Pikko Games</h1>
  <p>Offline puzzle games. No subscriptions, no ads mid-game.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</body>
</html>
